services:
  postgres:
    image: postgres:17-alpine
    container_name: eduzim-postgres
    environment:
      POSTGRES_USER: eduzim
      POSTGRES_PASSWORD: eduzim_dev
      POSTGRES_DB: eduzim
    ports:
      - "5432:5432"
    volumes:
      - eduzim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduzim -d eduzim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduzim-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - eduzim-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eduzim-minio
    environment:
      MINIO_ROOT_USER: eduzim
      MINIO_ROOT_PASSWORD: eduzim_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eduzim-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  eduzim-postgres-data:
  eduzim-redis-data:
  eduzim-minio-data:
